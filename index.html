<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff8fc7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pink Craft">
<title>Pink Craft</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffd9ec; font-family: system-ui, sans-serif; }
  html, body { overscroll-behavior: none; }
  body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #crosshair { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; display: none; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 2px #a03070; }
  #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair::after { left: 0; top: 8px; width: 18px; height: 2px; }

  #hotbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 4px; padding: 4px; background: rgba(255, 255, 255, .55); border-radius: 10px; }
  .slot { position: relative; width: min(44px, 9vw); height: min(44px, 9vw); border: 3px solid transparent; border-radius: 8px; box-sizing: border-box; padding: 3px; background: rgba(255, 255, 255, .35); }
  .cnt { position: absolute; right: 2px; bottom: 0; font: 700 12px system-ui, sans-serif; color: #fff; text-shadow: 0 0 2px #7a1048, 0 1px 2px #7a1048, 0 0 3px #7a1048; pointer-events: none; }
  .slot canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; border-radius: 3px; }
  .slot.on { border-color: #ff4fa3; background: #fff; }

  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom)); padding: 4px 12px; border-radius: 999px; background: rgba(255, 79, 163, .85); color: #fff; font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }

  #stats { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(64px + env(safe-area-inset-bottom)); width: min(420px, 86vw); display: flex; justify-content: space-between; pointer-events: none; }
  body.creative #stats { display: none; }
  #stats div { display: flex; gap: 1px; }
  #food { flex-direction: row-reverse; }
  #stats i { width: 18px; height: 16px; background-size: 100% 100%; image-rendering: pixelated; filter: drop-shadow(0 0 1px #5a2a44); }
  #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; background: radial-gradient(transparent 45%, rgba(255, 0, 70, .55)); }
  #death { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(150, 20, 70, .65); padding: 16px; box-sizing: border-box; }
  #death.hidden { display: none; }
  #revive { background: #ff4fa3; color: #fff; }
  #joy { position: fixed; left: calc(22px + env(safe-area-inset-left)); bottom: calc(70px + env(safe-area-inset-bottom)); width: 120px; height: 120px; border-radius: 50%; background: rgba(255, 255, 255, .4); border: 2px solid rgba(255, 255, 255, .8); display: none; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 79, 163, .85); pointer-events: none; }
  #jump { position: fixed; right: calc(26px + env(safe-area-inset-right)); bottom: calc(86px + env(safe-area-inset-bottom)); width: 76px; height: 76px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .8); background: rgba(255, 79, 163, .7); color: #fff; font-size: 30px; display: none; touch-action: none; }
  #menuBtn { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 10px; border: none; background: rgba(255, 255, 255, .6); color: #c2307a; font-size: 22px; }
  #bagBtn { position: fixed; right: calc(62px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); height: 44px; padding: 0 14px; border-radius: 10px; border: none; background: rgba(255, 255, 255, .6); color: #c2307a; font-size: 15px; font-weight: 700; }
  body.creative #bagBtn { display: none; }
  #bag { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255, 190, 222, .6); padding: 10px; box-sizing: border-box; }
  #bag.hidden { display: none; }
  #bag .card { max-width: none; width: auto; padding: 12px 16px; touch-action: pan-y; }
  #bag .card p { font-size: 12px; margin: 2px 0; }
  #bagCols { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; align-items: flex-start; }
  #recipes { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; min-width: 300px; max-height: calc(100vh - 170px); overflow-y: auto; touch-action: pan-y; padding-right: 4px; }
  .dur { position: absolute; left: 4px; right: 4px; bottom: 3px; height: 4px; background: #7a1048; border-radius: 2px; overflow: hidden; pointer-events: none; }
  .dur div { height: 100%; background: #6de38a; }
  .recipe { display: flex; align-items: center; gap: 5px; background: #ffe3f1; border-radius: 9px; padding: 3px 4px 3px 8px; color: #c2307a; font: 700 13px system-ui, sans-serif; }
  .part { display: inline-flex; align-items: center; gap: 2px; }
  .part canvas { width: 22px; height: 22px; image-rendering: pixelated; border-radius: 3px; }
  .part.lack { opacity: .4; }
  .rname { margin-left: 4px; font-weight: 600; font-size: 12px; color: #7a4a63; text-align: left; }
  .card .recipe button { display: inline-block; width: auto; margin: 0 0 0 auto; padding: 6px 12px; font-size: 13px; border-radius: 8px; background: #ff4fa3; color: #fff; }
  .card .recipe button:disabled { background: #ecc9da; }
  #bag #bagClose { margin-top: 8px; padding: 9px; }
  #bag h2 { margin: 0 0 4px; color: #ff4fa3; font-size: 20px; }
  #bagGrid { display: grid; grid-template-columns: repeat(9, auto); gap: 4px; margin-top: 8px; justify-content: center; }
  #bagGrid .slot { background: #ffe3f1; }
  #bagGrid .slot.hot { background: #ffc4e1; }
  #bagGrid .slot.on { background: #fff; }
  #bagClose { background: #ff4fa3; color: #fff; }
  #modeBtn { background: #ffe3f1; color: #c2307a; font-size: 14px; }
  body.touch #joy, body.touch #jump { display: block; }
  body.locked #crosshair { display: block; }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255, 190, 222, .78); padding: 16px; box-sizing: border-box; }
  #overlay.hidden { display: none; }
  .card { background: #fff; border-radius: 18px; padding: 22px 26px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 8px 30px rgba(194, 48, 122, .3); max-height: 100%; overflow: auto; box-sizing: border-box; }
  .card h1 { margin: 0 0 6px; color: #ff4fa3; font-size: 34px; letter-spacing: 1px; }
  .card p { margin: 6px 0; color: #7a4a63; font-size: 14px; line-height: 1.5; }
  .card button { display: block; width: 100%; margin-top: 12px; padding: 13px; border: none; border-radius: 12px; font-size: 17px; font-weight: 700; }
  #play { background: #ff4fa3; color: #fff; }
  #newWorld { background: #ffe3f1; color: #c2307a; }
  #install { background: #c2307a; color: #fff; }
  #install[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hurt"></div>
<div id="crosshair"></div>
<div id="toast"></div>
<div id="hotbar"></div>
<div id="stats"><div id="hp"></div><div id="food"></div></div>
<div id="joy"><div id="knob"></div></div>
<button id="jump" aria-label="Lompat">&#9650;</button>
<button id="bagBtn">Beg</button>
<button id="menuBtn" aria-label="Menu">&#9776;</button>

<div id="bag" class="hidden">
  <div class="card">
    <div id="bagCols">
      <div>
        <h2>Beg</h2>
        <p>Ketik item, kemudian ketik slot lain untuk pindah.<br>Baris atas ialah hotbar.</p>
        <div id="bagGrid"></div>
      </div>
      <div>
        <h2>Buat</h2>
        <p>Kumpul bahan, kemudian tekan Buat. Seret senarai untuk lihat semua.</p>
        <div id="recipes"></div>
      </div>
    </div>
    <button id="bagClose">Tutup</button>
  </div>
</div>

<div id="death" class="hidden">
  <div class="card">
    <h1>Awak mati!</h1>
    <p>Jangan risau, semua barang awak selamat dalam beg.</p>
    <button id="revive">Hidup Semula</button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <h1>Pink Craft</h1>
    <p id="tips"></p>
    <p>Pegang <b>Heart Block</b> &mdash; Pinky akan ikut awak!</p>
    <button id="install" hidden>Pasang Aplikasi</button>
    <button id="play">Main</button>
    <button id="modeBtn"></button>
    <button id="newWorld">Dunia Baru</button>
  </div>
</div>

<script type="module" src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  // Butang pasang: Chrome beri isyarat bila game boleh di-install
  var installBtn = document.getElementById('install'), installEvent = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installEvent = e;
    installBtn.hidden = false;
  });
  installBtn.addEventListener('click', function () {
    if (!installEvent) return;
    installEvent.prompt();
    installEvent = null;
    installBtn.hidden = true;
  });
  window.addEventListener('appinstalled', function () { installBtn.hidden = true; });
</script>
</body>
</html>
